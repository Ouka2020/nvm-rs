[package]
categories = [ "command-line-utilities" ]
default-run = "nvm"
description = "A tool to manage Node.js versions."
edition = "2024"
exclude = [
  "*.txt",
  ".cargo/",
  ".github/",
  "dist-workspace.toml",
  "logs/",
  "manifest.xml",
  "settings.*"
]
license = "MIT"
name = "nvm-windows"
repository = "https://github.com/Ouka2020/nvm-rs"
rust-version = "1.85"
version = "0.1.2"

[[bin]]
name = "nvm"
path = "src/main.rs"

[package.metadata.winresource]
# OriginalFilename = "PROGRAM.EXE"
LegalCopyright = "Copyright © 2026"
# FileDescription = "ExVS Runner"
# ProductName = "ExVS Runner sss"

[build-dependencies]
winresource = "0"

[dependencies]
anyhow             = "1"
clap               = { version = "4", features = [ "derive" ] }
comfy-table        = "8"
derive_more        = { version = "2", features = [ "deref" ] }
directories        = "5"
hex                = "0"
indicatif          = "0"
inquire            = "0"
junction           = "2"
log                = "0"
noyalib            = { version = "0", optional = true }
num_enum           = "0"
path-clean         = "1"
regex              = "1"
serde              = { version = "1", features = [ "derive" ] }
serde_json         = "1"
serde_with         = "3"
sha2               = "0"
strum              = { version = "0", features = [ "derive" ] }
tempfile           = "3"
toml               = { version = "1", optional = true }
tracing            = { version = "0", optional = true }
tracing-appender   = { version = "0", optional = true }
tracing-subscriber = { version = "0", features = [ "env-filter" ], optional = true }
ureq               = { version = "3", features = [ "json" ] }
url                = { version = "2", features = [ "serde" ] }
windows-sys        = { version = "0", features = [ "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading" ] }
winreg             = "0"
zip                = "8"

[dev-dependencies]
pretty_assertions = "1"
rstest            = "0"
# serial_test       = "4"

[features]
debug   = [ "dep:tracing", "dep:tracing-appender", "dep:tracing-subscriber" ]
default = [ "yaml" ]
toml    = [ "dep:toml" ]
yaml    = [ "dep:noyalib" ]

[profile.release]
codegen-units = 1       # 允许 LLVM 执行更好的优化。
lto           = true    # 启用链接时优化。
opt-level     = "s"     # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic         = "abort" # 通过禁用 panic 处理程序来提高性能。
strip         = true    # 确保移除调试符号。

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto      = "thin"
