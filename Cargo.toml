[package]
edition = "2024"
name    = "nvm-rs"
version = "0.1.0"

[[bin]]
name = "nvm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
jiff = { version = "0", features = ["serde"] }
log = "0"
noyalib = { version = "0", optional = true }
reqwest = "0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0"
serde_with = "3"
tokio = { version = "1", features = ["full"] }
toml = { version = "1", optional = true }
tracing = { version = "0", optional = true }
tracing-appender = { version = "0", optional = true }
tracing-subscriber = { version = "0", features = [
  "env-filter",
], optional = true }
winreg = "0"

[features]
debug   = ["dep:tracing", "dep:tracing-appender", "dep:tracing-subscriber"]
default = ["debug", "yaml"]
toml    = ["dep:toml"]
yaml    = ["dep:noyalib"]
